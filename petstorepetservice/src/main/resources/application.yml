spring:
  application:
    name: petstorepetservice
  datasource:
    url: ${AZURE_POSTGRESQL_URL:jdbc:postgresql://petstore.postgres.database.azure.com:5432/petstoreDB?user=petstore&password=AzureDBpw123!&sslmode=require}
    username: ${AZURE_POSTGRESQL_USER:petstore}
    password: ${AZURE_POSTGRESQL_PASSWORD:AzureDBpw123!}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: never
server:
  port: ${PETSTOREPETSERVICE_SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    ssl:
      enabled: false
    diskspace:
      enabled: false